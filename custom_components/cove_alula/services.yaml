cancel_alarm:
  name: Cancel alarm
  description: >
    Send an alarm "cancel" to the panel's monitoring (abort a triggered or
    in-progress alarm report). Generates a real central-station event.

confirm_alarm:
  name: Confirm alarm
  description: >
    Send an alarm "confirm" to the panel's monitoring (verify a real alarm).
    Generates a real central-station event.

bypass_zone:
  name: Bypass zone
  description: Bypass or unbypass a zone by its index.
  fields:
    zone:
      name: Zone index
      description: The numeric zone index to (un)bypass.
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 127
          mode: box
    bypass:
      name: Bypass
      description: True to bypass the zone, false to unbypass.
      required: false
      default: true
      selector:
        boolean:

force_arm:
  name: Force arm
  description: >
    Arm even when zones are open/not-ready. The default method bypasses any currently
    open zones and then arms with your stored PIN (most reliable). The "native" method
    uses the panel's built-in force-arm command instead. Bypasses clear on the next disarm.
  fields:
    mode:
      name: Mode
      description: Which armed mode to set.
      required: true
      example: away
      selector:
        select:
          options:
            - home
            - away
            - night
    method:
      name: Method
      description: How to force. "bypass" = bypass open zones then arm (PIN). "native" = panel forceArm command.
      required: false
      default: bypass
      selector:
        select:
          options:
            - bypass
            - native

arm:
  name: Arm
  description: >
    Arm the panel using your stored PIN, optionally silently (no exit beeps) and/or with
    no entry delay. Same options as the Cove app's silent toggle.
  fields:
    mode:
      name: Mode
      description: Which armed mode to set.
      required: true
      example: away
      selector:
        select:
          options:
            - home
            - away
            - night
    silent:
      name: Silent
      description: Arm without sounding the exit-delay beeps.
      required: false
      default: false
      selector:
        boolean:
    no_entry_delay:
      name: No entry delay
      description: Skip the entry delay while armed.
      required: false
      default: false
      selector:
        boolean:

disarm:
  name: Disarm
  description: >
    Disarm the panel using your stored PIN, optionally silently.
  fields:
    silent:
      name: Silent
      description: Disarm without sounding the panel.
      required: false
      default: false
      selector:
        boolean:
    no_entry_delay:
      name: No entry delay
      description: Send the no-entry-delay flag with the disarm command.
      required: false
      default: false
      selector:
        boolean:
